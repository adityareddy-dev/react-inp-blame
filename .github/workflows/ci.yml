name: CI

on:
  # Branches only: a version tag runs this through publish.yml instead, which waits for it.
  push:
    branches: ['**']
  pull_request:
  # Called by publish.yml, so a release runs the whole suite before it publishes.
  workflow_call:
  # Daily as well, so the next@canary job goes red the day a Next.js or React canary breaks something,
  # not at the next push. vite-app-fresh gets its daily run from this too.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both strip TypeScript natively, which is how node --test runs packages/core/test/*.test.ts.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The library's own types are checked by the build; this adds the Vite demo, its specs and the
      # walkthrough, which nothing else compiles.
      - run: npm run typecheck
      - run: npm run test:unit

  # Sees what users install, as the two vite-app jobs below do, and is the one gating job that checks
  # every file and subpath of it. The unit and e2e jobs resolve react-inp-blame through the workspace
  # link, so a file left out of `files`, an exports target that does not exist or a peer range npm
  # refuses to install would publish with both of them green. publish.yml needs this whole workflow, so a
  # release waits for this job as well.
  tarball:
    name: Packed tarball on Node 20.19
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Packed on Node 24, which is what publish.yml packs the release on. `prepack` builds it first.
      - run: npm pack -w packages/core --pack-destination "$RUNNER_TEMP"
      # Installed and loaded on the oldest Node the package promises, which no other job runs. '20.19' is
      # the newest 20.19.x to setup-node, and quoted because YAML reads a bare one as a number.
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
      - run: node scripts/pack-smoke.mjs --tarball "$RUNNER_TEMP"/react-inp-blame-*.tgz

  # A Vite app as `npm create vite -- --template react-ts` makes it, with the README's vite.config.ts,
  # given the packed tarball the way npm installs it. On the dev server @vitejs/plugin-react's Fast
  # Refresh preamble creates React's DevTools hook and the library chains onto it. A production build has
  # no preamble, so there the install script runs first. A job of its own, beside e2e rather than in it,
  # so a run takes no longer.
  vite-app:
    name: create-vite app from the packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-ts/package-lock.json
      - run: npm ci
      - run: npm pack -w packages/core --pack-destination "$RUNNER_TEMP"
      - run: npx playwright install --with-deps chromium
      - name: The app from its lockfile
        run: node scripts/vite-app.mjs --tarball "$RUNNER_TEMP"/react-inp-blame-*.tgz

  # The same app with no lockfile, so npm takes the newest release inside each range in the fixture's
  # package.json, a new minor or patch of anything the app uses. A new major only reaches it when the
  # fixture is made again from a newer create-vite. The daily run of this workflow makes it the check on
  # those releases. A job and not a step of vite-app, because GitHub shows a step that is allowed to fail
  # as passed even when it fails.
  vite-app-fresh:
    name: create-vite app, dependencies resolved today
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Goes red on the first run after a release in those ranges breaks the app, without failing the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-ts/package-lock.json
      - run: npm ci
      - run: npm pack -w packages/core --pack-destination "$RUNNER_TEMP"
      - run: npx playwright install --with-deps chromium
      - run: node scripts/vite-app.mjs --fresh --tarball "$RUNNER_TEMP"/react-inp-blame-*.tgz

  e2e:
    name: Vite demo, React 17 to 19.2, Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # `chromium` installs the full Chromium build beside the headless shell: e2e/inp.spec.ts runs in
      # Chromium's own headless mode (channel: 'chromium'). Firefox and WebKit run cross-browser.spec.ts.
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Vite demo, development build
        run: npm test
      - name: Vite demo, production build
        run: npm run test:prod
      - name: Vite demo on React 19.2.8, 19.1.9, 18.3.1, 18.2.0 and 17.0.2
        run: |
          node scripts/react-matrix.mjs
          npm install
          npm test -w apps/demo-react192
          npm test -w apps/demo-react191
          npm test -w apps/demo-react18
          npm test -w apps/demo-react182
          npm test -w apps/demo-react17
      # Production too, because that is where the bundler decides what evaluates before the app's entry
      # body, and where React 17 registered with no hook at all until the Vite plugin gave the install
      # call a script of its own ahead of the page's. About half a minute each.
      - name: Vite demo on React 19.2.8, 19.1.9, 18.3.1, 18.2.0 and 17.0.2, production builds
        run: |
          npm run test:prod -w apps/demo-react192
          npm run test:prod -w apps/demo-react191
          npm run test:prod -w apps/demo-react18
          npm run test:prod -w apps/demo-react182
          npm run test:prod -w apps/demo-react17
      - name: Next.js, next dev
        run: npm test -w apps/next-demo
      - name: Next.js, Turbopack production build
        run: npm run test:prod -w apps/next-demo
      - name: Next.js, webpack production build
        run: npm run test:prod:webpack -w apps/next-demo

  # Next.js before 16.3 has no instrumentationClientInject, so the app's own instrumentation-client
  # re-exports react-inp-blame/next-client: the line withInpBlame prints until it is there. 16.2 and 15.5
  # are the newest minors of each major below 16.3, and 15.3 is the oldest with an instrumentation-client.
  # Pinned to the patches last checked, so that a release, which waits for this job, does not turn on
  # what npm serves that day.
  next-older:
    name: Next.js ${{ matrix.next }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        next: ['16.2.12', '15.5.26', '15.3.9']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install next@${{ matrix.next }} -w apps/next-demo
      - run: npm ls next
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: The line withInpBlame prints, in instrumentation-client.ts
        run: echo "export { onRouterTransitionStart } from 'react-inp-blame/next-client';" > apps/next-demo/instrumentation-client.ts
      - name: next dev
        run: npm test -w apps/next-demo
      - name: next dev --turbopack
        if: ${{ !cancelled() && startsWith(matrix.next, '15.') }}
        run: INP_BUNDLER=turbopack npm test -w apps/next-demo
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run test:prod -w apps/next-demo
      # 15.x builds with webpack by default; this is where its Turbopack rule keeps the names.
      - name: Turbopack production build
        if: ${{ !cancelled() && startsWith(matrix.next, '15.') }}
        run: INP_BUNDLER=turbopack npm run test:prod -w apps/next-demo
      - name: webpack production build
        if: ${{ !cancelled() && startsWith(matrix.next, '16.') }}
        run: npm run test:prod:webpack -w apps/next-demo

  next-canary:
    name: Next.js canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Goes red the day a Next.js canary, or the React canary it vendors for the App Router, changes
    # something the library relies on, without failing the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install next@canary -w apps/next-demo
      - run: npm ls next
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: next dev
        run: npm test -w apps/next-demo
      - name: Turbopack production build
        run: npm run test:prod -w apps/next-demo
      - name: webpack production build
        run: npm run test:prod:webpack -w apps/next-demo
      # The tarball job's install, beside next@canary: that npm still resolves the two together, and that
      # withInpBlame lets a prerelease of a later Next.js past its floor. The suites above say nothing
      # about that and it says nothing about them, so it runs whether or not they passed.
      - name: Packed tarball beside next@canary
        if: ${{ !cancelled() }}
        run: node scripts/pack-smoke.mjs next-canary
