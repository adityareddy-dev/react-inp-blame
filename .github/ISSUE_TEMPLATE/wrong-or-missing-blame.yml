name: Wrong or missing blame
description: A slow interaction got no report, or the report named the wrong thing.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        The report is what makes this diagnosable. Open the badge, or turn on
        `debugGlobal: true` and run `JSON.stringify(__REACT_INP_BLAME__.last(), null, 2)`
        in the console right after the slow interaction. `reports()` gives the last 50.
        Reports carry the URL of the page and the label of the element you clicked, so read
        them through before pasting.
  - type: input
    id: clicked
    attributes:
      label: What you clicked
      description: The element and the page, for example "the Save button on /settings". Or the key you pressed.
    validations:
      required: true
  - type: textarea
    id: blamed
    attributes:
      label: What it blamed
      description: The component or handler the report named, and its sentence. Say "no report at all" if nothing appeared.
    validations:
      required: true
  - type: textarea
    id: slow
    attributes:
      label: What you think is slow
      description: The component, handler or work you believe took the time, and why you think so.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: The JSON from `last()` or `reports()`. If there is no report, paste `stats()` instead.
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: react-inp-blame, react and react-dom, and the framework and bundler.
      placeholder: react-inp-blame 0.2.0, react 19.3.0, react-dom 19.3.0, next 16.3.5
    validations:
      required: true
  - type: dropdown
    id: bundler
    attributes:
      label: Bundler
      options:
        - Next.js, Turbopack
        - Next.js, webpack
        - Vite
        - Vite, with React Router, Remix, TanStack Start or Astro
        - Another bundler, with react-inp-blame/auto
        - Something else
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Development or production build
      options:
        - Development
        - Production
        - Both
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Long Animation Frames are Chromium only, which changes what a report can say.
      placeholder: Chrome 147 on Windows 11
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The component, if you can share it
      description: The handler and the element that was clicked, cut down as far as it still reproduces.
      render: tsx
