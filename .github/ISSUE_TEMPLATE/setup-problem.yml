name: Setup problem
description: The library will not install, will not build, or nothing appears on the page.
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        If the console printed a warning, it ends with a link to its entry under
        [Troubleshooting](https://github.com/adityareddy-dev/react-inp-blame/blob/main/docs/troubleshooting.md). Read that first.

        Two quick checks first. `stats()` says whether the library installed at all and why not:
        turn on `debugGlobal: true` and read `__REACT_INP_BLAME__.stats()`. And with Next.js,
        the options are the **second** argument, `withInpBlame(nextConfig, { runtime: { overlay: true } })`.
  - type: textarea
    id: what
    attributes:
      label: What you did and what happened
      description: The steps from a fresh install, and where it stopped.
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Next.js
        - Vite
        - React Router
        - Remix
        - TanStack Start
        - Astro
        - webpack or Rspack, with react-inp-blame/auto
        - Something else
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your next.config, vite.config or astro.config
      description: The whole file, or the part that calls `withInpBlame` or `inpBlame`. For `/auto`, your entry module's first lines.
      render: ts
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The warning or error, or what stats() says
      description: The full text of the console warning or build error, or `__REACT_INP_BLAME__.stats()`.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: react-inp-blame, the framework, react and react-dom, and Node.
      placeholder: react-inp-blame 0.1.1, next 16.3.5, react 19.3.0, node 24.19
    validations:
      required: true
